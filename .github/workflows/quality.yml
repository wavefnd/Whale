name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whale-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTUP_TOOLCHAIN: stable

jobs:
  asmobj:
    name: Build Wave asmobj prerequisites
    uses: ./.github/workflows/asmobj.yml

  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: python tools/ci.py run --name toolchain -- rustc -vV
      - run: python tools/ci.py run --name format -- python tools/format-rust.py --check
      - name: Retain command logs and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  clippy:
    needs: asmobj
    name: Clippy / ${{ matrix.features }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    env:
      WHALE_ASMOBJ_DIR: ${{ github.workspace }}/.ci-asmobj/x86_64-unknown-linux-gnu
      FEATURE_FLAGS: ${{ matrix.features == 'all' && '--all-features' || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download complete Wave asmobj module
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.asmobj.outputs.artifact_name }}
          path: .ci-asmobj
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: python tools/ci.py run --name toolchain -- rustc -vV
      - name: Reject warnings in every workspace target
        run: python tools/ci.py run --name clippy -- cargo clippy --workspace --all-targets --locked ${{ env.FEATURE_FLAGS }} -- -D warnings
      - name: Retain command logs and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clippy-${{ matrix.features }}
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  docs:
    needs: asmobj
    name: Public crate documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WHALE_ASMOBJ_DIR: ${{ github.workspace }}/.ci-asmobj/x86_64-unknown-linux-gnu
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download complete Wave asmobj module
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.asmobj.outputs.artifact_name }}
          path: .ci-asmobj
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal
      - run: python tools/ci.py run --name toolchain -- rustc -vV
      - run: python tools/ci.py run --name rustdoc -- cargo doc --workspace --all-features --no-deps --locked
      - name: Retain command logs and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustdoc
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  workflows:
    name: Workflow syntax and CI helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install checksum-verified actionlint
        run: |
          curl --fail --location --retry 3 --max-time 120 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Check all workflows and expressions
        run: python tools/ci.py run --name actionlint -- /tmp/actionlint -color
      - name: Check CI helper failure handling
        run: python tools/ci.py run --name runner-tests -- python -m unittest discover -s tools -p test_*.py -v
      - name: Check core module dependency direction
        run: python tools/ci.py run --name module-layers -- python tools/check_module_layers.py
      - name: Retain command logs and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-validation
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  bounded-validation:
    needs: asmobj
    name: Bounded fuzz, memory model and AST schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WHALE_ASMOBJ_DIR: ${{ github.workspace }}/.ci-asmobj/x86_64-unknown-linux-gnu
      WHALE_FUZZ_ARTIFACT_DIR: .ci-artifacts/fuzz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download complete Wave asmobj module
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.asmobj.outputs.artifact_name }}
          path: .ci-asmobj
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check -r tools/requirements-schema.txt
      - name: Build real library boundary targets
        run: python tools/ci.py run --name fuzz-build --timeout 300 -- cargo build --workspace --all-features --examples --locked
      - name: Bounded assembler, object, IR and AST mutation targets
        run: python tools/ci.py run --name boundary-fuzz --timeout 240 -- python tools/fuzz_smoke.py --binary target/debug/examples/fuzz_boundaries --cases 512 --seed 1464353100 --timeout 45
      - name: Versioned schema and decoder agreement
        run: python tools/ci.py run --name schema-agreement --timeout 90 -- python tools/schema_agreement.py --binary target/debug/examples/schema_probe
      - name: Independent tracked-memory operation model
        env:
          WHALE_MEMORY_CASES: '256'
          WHALE_MEMORY_SEED: '1'
        run: python tools/ci.py run --name memory-model --timeout 90 -- cargo test -p ir --all-features --locked --lib generated_memory_campaign -- --ignored --nocapture
      - name: Retain logs, replay commands and minimized inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bounded-validation
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
