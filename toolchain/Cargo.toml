[package]
name = "toolchain"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[features]
default = []
rust-reference = ["assembler/rust-reference", "ir/rust-reference"]

[dependencies]
assembler = { path = "../bindings/rust/assembler" }
asmobj = { path = "../bindings/rust/asmobj" }
backend-api = { path = "../backend-api" }
target-spec = { path = "../target-spec" }
ir = { path = "../bindings/rust/ir" }
diagnostic = { path = "../diagnostic" }
object = { path = "../object" }
