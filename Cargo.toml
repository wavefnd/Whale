[workspace]
members = [
    "diagnostic",
    "bindings/rust/assembler",
    "bindings/rust/amd64",
    "bindings/rust/aarch64",
    "bindings/rust/riscv64",
    "bindings/rust/loongarch64",
    "backend-api",
    "toolchain",
    "bindings/rust/asmobj",
    "examples/external-target",
    "reverse",
    "target-spec",
    "object",
    "linker",
    "bindings/rust/ir",
]

[workspace.package]
rust-version = "1.86"

[package]
name = "whale"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[features]
default = ["builtin-assemblers", "native-linker"]
builtin-assemblers = ["asm-amd64", "asm-aarch64", "asm-riscv64", "asm-loongarch64"]
asm-amd64 = ["dep:amd64"]
asm-aarch64 = ["dep:aarch64"]
asm-riscv64 = ["dep:riscv64"]
asm-loongarch64 = ["dep:loongarch64"]
socket-cli = ["ir/socket"]
native-linker = ["dep:linker"]
rust-reference = ["assembler/rust-reference", "ir/rust-reference", "toolchain/rust-reference", "amd64?/rust-reference", "aarch64?/rust-reference", "riscv64?/rust-reference", "loongarch64?/rust-reference"]

[dependencies]
assembler = { path = "bindings/rust/assembler" }
amd64 = { path = "bindings/rust/amd64", optional = true }
aarch64 = { path = "bindings/rust/aarch64", optional = true }
riscv64 = { path = "bindings/rust/riscv64", optional = true }
loongarch64 = { path = "bindings/rust/loongarch64", optional = true }
toolchain = { path = "toolchain" }
reverse = { path = "reverse" }
linker = { path = "linker", optional = true }
backend-api = { path = "backend-api" }
diagnostic = { path = "diagnostic" }
target-spec = { path = "target-spec" }
object = { path = "object" }
ir = { path = "bindings/rust/ir", version = "0.1.0", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
same-file = "1"
tempfile = "3"

[build-dependencies]
serde_json = "1"

[[example]]
name = "benchmark_probe"
required-features = ["asm-amd64"]

[[example]]
name = "fuzz_boundaries"
required-features = ["asm-amd64"]
